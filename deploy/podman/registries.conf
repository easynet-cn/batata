# Podman registry mirror configuration (registries.conf)
#
# Purpose: migrate the registry-mirrors from Docker Desktop's
# `~/.docker/daemon.json` to Podman. Derived from the Docker Desktop
# registry-mirrors list (deduplicated, dead mirrors removed).
#
# ---------------------------------------------------------------------------
# Install location (important on macOS)
# ---------------------------------------------------------------------------
# Podman containers run inside the `podman machine` Linux VM, so this file must
# be placed at /etc/containers/registries.conf **inside the VM** — putting it in
# ~/.config/containers/ on the Mac host has no effect.
#
# Install (from the repository root):
#   podman machine start
#   podman machine ssh "sudo tee /etc/containers/registries.conf > /dev/null" \
#     < deploy/podman/registries.conf
#
# Verify:
#   podman machine ssh "sudo head -5 /etc/containers/registries.conf"
#   podman pull docker.io/library/busybox:latest
#
# ---------------------------------------------------------------------------
# Notes
# ---------------------------------------------------------------------------
# - Podman does NOT read ~/.docker/daemon.json; the two configurations are
#   independent.
# - Mirrors are tried in the order listed; if all fail, Podman falls back to the
#   official docker.io registry.
# - More mirrors is not better: unreachable mirrors add connection timeouts.
#   Keep only 3-5 mirrors that are known to work.
# - Rebuilding or upgrading the podman machine resets this file, so re-run the
#   install command above afterwards.
# - On older Podman versions that do not support a per-mirror `insecure` field,
#   remove the corresponding HTTP mirror or switch it to its https URL.

# Default registry searched for short image names (e.g. mysql:latest).
# With this set, Podman will not prompt interactively to pick a registry.
unqualified-search-registries = ["docker.io"]

[[registry]]
prefix = "docker.io"
location = "docker.io"

# ---- Recommended: HTTPS mirrors ----
[[registry.mirror]]
location = "docker.m.daocloud.io"

[[registry.mirror]]
location = "docker.mirrors.ustc.edu.cn"

[[registry.mirror]]
location = "docker.nju.edu.cn"

[[registry.mirror]]
location = "xx4bwyg2.mirror.aliyuncs.com"

[[registry.mirror]]
location = "dockerproxy.com"

# ---- Optional: personal / HTTP mirrors ----

# DaoCloud personal mirror (plain HTTP, requires insecure = true)
# [[registry.mirror]]
# location = "f1361db2.m.daocloud.io"
# insecure = true

# NetEase mirror: the original configuration used http; prefer https, or add
# insecure = true if you must use http.
# [[registry.mirror]]
# location = "hub-mirror.c.163.com"
# insecure = true

# ---- Removed (kept as a record only, do not enable) ----
# registry.docker-cn.com    :Docker's official China mirror, discontinued;
#                            keeping it only adds connection timeouts
# huecker.io                :overseas (US) mirror, slow from China
# dockerhub.timeweb.cloud   :overseas (Russia) mirror, slow from China
# noohub.ru                 :overseas (Russia) mirror, slow from China
