apiVersion: v1
kind: Service
metadata:
  name: batata
  labels:
    app: batata
spec:
  type: ClusterIP
  selector:
    app: batata
  ports:
    - name: http-main
      port: 8848
      targetPort: http-main
    - name: http-console
      port: 8081
      targetPort: http-console
    - name: http-apollo
      port: 8080
      targetPort: http-apollo
    - name: grpc-sdk
      port: 9848
      targetPort: grpc-sdk
    - name: grpc-cluster
      port: 9849
      targetPort: grpc-cluster
    - name: consul
      port: 8500
      targetPort: consul
    - name: mcp
      port: 9080
      targetPort: mcp
---
# Optional NodePort exposure for non-cloud / bare-metal clusters.
