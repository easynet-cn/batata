# SDK Tests Stack (Podman Compose)
#
# Usage:
#   Start infra:   podman-compose up -d mysql batata
#   Run SDK tests: podman-compose --profile tests up

services:
  # MySQL database for Batata
  mysql:
    image: docker.io/library/mysql:latest
    container_name: batata-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: batata
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - batata-test

  # Batata server
  batata:
    build:
      context: ..
      dockerfile: Containerfile
    container_name: batata-test-server
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "8081:8081"
      - "8500:8500"
      - "18080:18080"
    environment:
      - DB_URL=mysql://root:root@mysql:3306/batata
      - BATATA_DB_MIGRATION_ENABLED=true
      - NACOS_AUTH_ENABLED=true
      - NACOS_AUTH_TOKEN_SECRET_KEY=YmF0YXRhLXRlc3Qtc2VjcmV0LWtleS1mb3Itand0LXRva2Vu
      # Enable the Consul + Apollo compatibility plugins for the SDK suites
      # (both are off by default in conf/application.yml).
      - BATATA_PLUGIN_CONSUL_ENABLED=true
      - BATATA_PLUGIN_APOLLO_ENABLED=true
      - BATATA_PLUGIN_APOLLO_PORT=18080
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/v3/admin/core/state/liveness"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - batata-test

  # Nacos Java SDK Tests
  nacos-tests:
    build:
      context: ./nacos-java-tests
      dockerfile: Containerfile
    container_name: nacos-sdk-tests
    environment:
      - NACOS_SERVER=batata:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
    depends_on:
      batata:
        condition: service_healthy
    networks:
      - batata-test
    profiles:
      - tests

  # Consul Go SDK Tests
  consul-tests:
    build:
      context: ./consul-go-tests
      dockerfile: Containerfile
    container_name: consul-sdk-tests
    environment:
      - CONSUL_HTTP_ADDR=batata:8500
      - CONSUL_HTTP_TOKEN=root
    depends_on:
      batata:
        condition: service_healthy
    networks:
      - batata-test
    profiles:
      - tests

  # Apollo Java SDK Tests
  apollo-tests:
    build:
      context: ./apollo-java-tests
      dockerfile: Containerfile
    container_name: apollo-sdk-tests
    environment:
      - APOLLO_META=http://batata:18080
      - APOLLO_OPENAPI_URL=http://batata:18080
      - APOLLO_OPENAPI_TOKEN=admin
    depends_on:
      batata:
        condition: service_healthy
    networks:
      - batata-test
    profiles:
      - tests

networks:
  batata-test:
    driver: bridge

volumes:
  mysql-data:
