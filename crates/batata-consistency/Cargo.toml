[package]
publish = false
name = "batata-consistency"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Raft and Distro consensus protocols for Batata"

[dependencies]
batata-common = { workspace = true }
batata-server-api = { workspace = true }

# Raft consensus
openraft = { workspace = true }
rocksdb = { workspace = true }

# gRPC
tonic = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Concurrency
dashmap = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs"] }
futures = { workspace = true }

# Logging
tracing = { workspace = true }

# Metrics facade (lock alive-count gauge published by the expire scanner)
metrics = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Time
chrono = { workspace = true }

# Hashing
md-5 = { workspace = true }
const-hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
# Only the blocking-dispatch bench needs a multi-thread runtime for context.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
name = "raft_serialization_bench"
harness = false

[[bench]]
name = "async_trait_overhead_bench"
harness = false

[[bench]]
name = "plugin_registry_apply_hooks_bench"
harness = false

[[bench]]
name = "blocking_apply_io_bench"
harness = false
