[package]
name = "batata-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Batata - Nacos-compatible service discovery and configuration management server"

[features]
default = ["consul", "apollo"]
consul = ["dep:batata-plugin-consul"]
apollo = ["dep:batata-plugin-apollo"]
full = ["consul", "apollo"]
# Profiling / diagnostics (off by default; enable at build time):
#   pprof        -> exposes /pprof/* CPU flamegraph endpoints (actix).
#                   CPU sampling works on Linux; build with --features pprof.
#   tokio-console-> enables tokio-console task tracing. For real task spans you
#                   MUST also build with RUSTFLAGS="--cfg tokio_unstable".
pprof = ["dep:pprof"]
tokio-console = ["dep:console-subscriber"]

[lib]
name = "batata_server"
path = "src/lib.rs"

[[bin]]
name = "batata-server"
path = "src/main.rs"

[dependencies]
# Internal crates (always required)
batata-common = { workspace = true }
batata-api = { workspace = true }
batata-server-api = { workspace = true }
batata-migration = { workspace = true }
batata-persistence = { workspace = true }
batata-auth = { workspace = true }
batata-consistency = { workspace = true }
batata-core = { workspace = true }
batata-config = { workspace = true }
batata-naming = { workspace = true }
batata-console = { workspace = true }
batata-server-common = { workspace = true }
batata-plugin = { workspace = true }
batata-maintainer-client = { workspace = true }

# Internal crates (always compiled in)
batata-ai = { workspace = true }
batata-copilot = { workspace = true }
batata-plugin-cloud = { workspace = true }
batata-mesh = { workspace = true }

# Optional internal crates (gated by feature flags)
batata-plugin-consul = { workspace = true, optional = true }
batata-plugin-apollo = { workspace = true, optional = true }

# Web framework
actix-web = { workspace = true }
actix-files = { workspace = true }
actix-rt = { workspace = true }

# gRPC
tonic = { workspace = true, features = ["transport", "tls-native-roots"] }
prost = { workspace = true }
tower = { workspace = true }
http = { workspace = true }

# Database
sea-orm = { workspace = true }

# Configuration
config = { workspace = true }
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tokio-stream = { workspace = true }
async-trait = { workspace = true }

# Logging & Telemetry
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
tracing-bunyan-formatter = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Auth
jsonwebtoken = { workspace = true }

# System info
sysinfo = { workspace = true }

# Utils
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Caching
moka = { workspace = true }
dashmap = { workspace = true }

# Sync primitives
parking_lot = { workspace = true }

# Consensus
openraft = { workspace = true }
rocksdb = { workspace = true }

# Diagnostics (optional, feature-gated)
# `pprof` CPU sampling requires Linux + perf privileges (same as `perf`);
# `flamegraph` feature renders an SVG inline (no external perl scripts needed).
pprof = { version = "0.14", features = ["flamegraph"], optional = true }
console-subscriber = { version = "0.4", optional = true }

[dev-dependencies]
actix-http = { workspace = true }
batata-client = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "naming_bench"
harness = false

[[bench]]
name = "auth_bench"
harness = false

[[bench]]
name = "circuit_breaker_bench"
harness = false

[build-dependencies]
tonic-prost-build = { workspace = true }
