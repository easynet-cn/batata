[package]
publish = false
name = "batata-mesh"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Service Mesh support for Batata (xDS protocol, Istio integration)"

[build-dependencies]
tonic-prost-build = { workspace = true }

[dependencies]
# gRPC and protobuf
tonic = { workspace = true, features = ["transport", "codegen"] }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
http = { workspace = true }

# Async
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-stream = { workspace = true, features = ["net"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Stable per-resource content versions for Delta xDS
sha2 = { workspace = true }
