[package]
name = "batata-consul-client"
# Independent version: this crate has no inbound workspace dependencies, so it
# must be able to publish patch releases without bumping all 25 members.
version = "1.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Consul-compatible HTTP client SDK for Batata"
readme = "README.md"
keywords = ["consul", "batata", "http", "service-discovery", "kv-store"]
categories = ["network-programming", "api-bindings"]
documentation = "https://docs.rs/batata-consul-client"
rust-version = "1.89"

[dependencies]
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }

tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
wiremock = { workspace = true }
