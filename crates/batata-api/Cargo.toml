[package]
name = "batata-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "API contract for Batata (gRPC and HTTP models, shared by clients and server)"
readme = "README.md"
keywords = ["nacos", "batata", "grpc", "api", "microservices"]
categories = ["network-programming", "config"]
documentation = "https://docs.rs/batata-api"
rust-version = "1.88"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# gRPC
prost = { workspace = true }
prost-types = { workspace = true }
tonic = { workspace = true, features = ["transport", "tls-native-roots"] }
tonic-prost = { workspace = true }
http = { workspace = true }

# Async
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# Utils
bytes = { workspace = true }
if-addrs = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
