[package]
name = "batata-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK client for Batata/Nacos"
readme = "README.md"
keywords = ["nacos", "batata", "service-discovery", "configuration", "microservices"]
categories = ["network-programming", "config"]
documentation = "https://docs.rs/batata-client"
homepage = "https://github.com/easynet-cn/batata"
rust-version = "1.88"

[dependencies]
batata-api = { workspace = true }

# gRPC
# `tls-aws-lc` makes tonic pick the aws-lc-rs rustls provider explicitly.
# Without it tonic falls back to `rustls::ClientConfig::builder()`, which
# panics when a workspace build enables both `ring` and `aws_lc_rs`.
tonic = { workspace = true, features = ["transport", "tls-native-roots", "tls-aws-lc"] }
prost = { workspace = true }

# HTTP client
reqwest = { workspace = true, features = ["multipart"] }
bytes = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
toml = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Streaming
tokio-stream = { workspace = true }
futures = { workspace = true }

# Utilities
uuid = { workspace = true }
md-5 = { workspace = true }
const-hex = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Random
rand = { workspace = true }

# Crypto / signing
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

# Time
chrono = { workspace = true }

# Metrics
prometheus = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rcgen = { workspace = true }
wiremock = { workspace = true }
uuid = { workspace = true }
rustls = "0.23"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net"] }
tokio-rustls = "0.26"
tokio-stream = { workspace = true, features = ["net"] }

[[bench]]
name = "client_bench"
harness = false
