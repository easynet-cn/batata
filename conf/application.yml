#
# Batata Configuration
#
# Batata is a Rust implementation compatible with Nacos 3.x.
# All config keys use the `batata.*` prefix. Override any key via:
#   - BATATA_* environment variables (e.g., BATATA_SERVER_MAIN_PORT=9090)
#   - CLI property overrides (e.g., --batata.server.main.port=9090)
#
# Configuration mapping: nacos.* keys map to batata.* keys.
# Notable differences:
#   nacos.core.auth.system.type=nacos     ->  batata.core.auth.system.type=default
#   nacos.core.auth.plugin.nacos.*        ->  batata.core.auth.plugin.default.*
#   nacos.core.auth.plugin.oidc.*         ->  batata.core.auth.oauth.*
#   nacos.core.auth.ldap.basedc           ->  batata.core.auth.ldap.base_dc
#   nacos.core.auth.ldap.userDn           ->  batata.core.auth.ldap.bind_dn
#   nacos.core.auth.ldap.userdn           ->  batata.core.auth.ldap.user_dn_pattern
#

# =============================================================================
# Server
# =============================================================================

# Main HTTP server port (SDK clients connect here)
batata.server.main.port: 8848

# Server web context path (used for HTTP API prefix, e.g., /nacos/v2/cs/*)
batata.server.context_path: /nacos

# Standalone mode: true = single node, false = cluster mode
batata.standalone: true

# Deployment type: merged | server | console | serverWithMcp
# - merged (default): Main Server (8848) + Console (8081) in same process
# - server:           Main Server only (no console)
# - console:          Console only (connects to remote server)
# - serverWithMcp:    Main Server + MCP Registry (9080)
#batata.deployment.type: merged

# --- Network Configuration ---
# If prefer hostname over ip for server addresses in cluster.conf
#batata.inetutils.prefer_hostname_over_ip: false

# Specify local server's IP address
#batata.inetutils.ip_address:

# =============================================================================
# Console
# =============================================================================

# Console HTTP server port
batata.console.port: 8081

# Console web context path (empty = root)
batata.console.context_path:

# Enable/disable console UI
#batata.console.ui.enabled: true

# Default console UI version: 'next' (new UI) or 'legacy' (old UI)
# Not yet implemented
#batata.console.ui.default: next

# --- Console Upload & Encoding ---
# Maximum upload file size for console (e.g. skill zip). Default 10MB.
#batata.console.upload.max_file_size: 10MB
#batata.console.upload.max_request_size: 10MB

# Console encoding
#batata.console.encoding.enabled: true
#batata.console.encoding.force: true
#batata.console.encoding.charset: UTF-8

# --- Console CORS (Cross-Origin Resource Sharing) ---
# Whether to allow credentials (cookies, authorization headers, TLS client certificates)
#batata.console.cors.allow_credentials: true

# Allowed headers, comma separated. Empty means allow all headers (*)
#batata.console.cors.allowed_headers:

# Maximum age (in seconds) of the CORS preflight request cache
#batata.console.cors.max_age: 18000

# Allowed HTTP methods, comma separated. Empty means allow all methods (*)
#batata.console.cors.allowed_methods:

# Allowed origins, comma separated. Empty means allow all origin patterns (*)
# Example: http://localhost:8080,https://example.com
#batata.console.cors.allowed_origins:

# --- Console Remote Mode (used when deployment type is `console`) ---

# Remote server address (fallback if batata.member.list and cluster.conf are not configured)
#batata.console.remote.server_addr: http://127.0.0.1:8848

# Remote server context path (links to server's context_path)
#batata.console.remote.server_context_path: /nacos

# Remote data auto-refresh settings
#batata.console.remote.refresh_interval_secs: 30     # polling interval for cluster info
#batata.console.remote.initial_delay_secs: 5         # initial delay before first refresh

# Remote server credentials (used as fallback when server identity is not configured)
#batata.console.remote.username: nacos
#batata.console.remote.password: nacos

# =============================================================================
# Database
# =============================================================================

# Storage mode is auto-derived:
#   platform = "mysql"/"postgresql"       -> External DB (requires batata.db.url)
#   platform = empty + standalone=true    -> Embedded RocksDB (single node)
#   platform = empty + standalone=false   -> Distributed Raft + RocksDB (cluster)
batata.sql.init.platform: mysql

# Database connection URL
# For MySQL:      mysql://user:password@localhost:3306/batata
# For PostgreSQL: postgres://user:password@localhost:5432/batata
# Also configurable via DATABASE_URL env var or --db-url CLI arg
batata.db.url:

# Connection pool settings
batata.db.pool.max_connections: 100
batata.db.pool.min_connections: 10
batata.db.pool.connect_timeout: 30
batata.db.pool.acquire_timeout: 30
batata.db.pool.idle_timeout: 600
batata.db.pool.max_lifetime: 1800
batata.db.pool.sqlx_logging: false

# Auto-run database migrations on startup (only for external DB mode)
batata.db.migration.enabled: true

# Enable datasource SQL logging
#batata.plugin.datasource.log.enabled: true

# Base data directory (for embedded modes only)
#batata.persistence.embedded.data_dir: data
# RocksDB database name (subdirectory under data_dir, default: batata_rocksdb)
#batata.persistence.embedded.db_name: batata_rocksdb

# =============================================================================
# Authentication
# =============================================================================

# Auth system type: default, ldap, or oauth
# (nacos.core.auth.system.type=nacos maps to batata.core.auth.system.type=default)
batata.core.auth.system.type: default

# Enable auth for each API surface
batata.core.auth.enabled: true
batata.core.auth.admin.enabled: true
batata.core.auth.console.enabled: true

# Turn on/off caching of auth information.
# By turning on this switch, the update of auth information would have a 15 seconds delay.
batata.core.auth.caching.enabled: true

# Server identity for trusted server-to-server communication
# Used by InnerApi auth bypass and Console remote mode
batata.core.auth.server.identity.key: default-server-key
batata.core.auth.server.identity.value: default-server-value

# JWT token configuration (default auth plugin)
# (nacos.core.auth.plugin.nacos.* maps to batata.core.auth.plugin.default.*)
batata.core.auth.plugin.default.token.expire.seconds: 18000
# Secret key (Base64-encoded). Generate with: openssl rand -base64 32
batata.core.auth.plugin.default.token.secret.key: NzViOWFlNjYtMWM3MC00ZDYwLTg4OWUtMjYxYTdhMzA1Y2Jm
# Enable token parse and validation cache
#batata.core.auth.plugin.default.token.cache.enable: false

# Allow anonymous read access, default false.
# Current only ai (skill, agentspec) supported.
#batata.core.auth.default.anonymous.ai.enabled: false

# --- LDAP Configuration (when batata.core.auth.system.type=ldap) ---
#batata.core.auth.ldap.url: ldap://localhost:389
#batata.core.auth.ldap.base_dc: dc=example,dc=org
#batata.core.auth.ldap.bind_dn: cn=admin,${batata.core.auth.ldap.base_dc}
#batata.core.auth.ldap.password: admin
#batata.core.auth.ldap.user_dn_pattern: cn={0},dc=example,dc=org
#batata.core.auth.ldap.filter.prefix: uid
#batata.core.auth.ldap.case.sensitive: true
#batata.core.auth.ldap.ignore.partial.result.exception: false

# --- OAuth2/OIDC Configuration (when batata.core.auth.system.type=oauth) ---
# (nacos.core.auth.plugin.oidc.* maps to batata.core.auth.oauth.*)
#batata.core.auth.oauth.enabled: false

# OIDC issuer URI (for auto-discovery)
#batata.core.auth.oauth.issuer_uri:

# OIDC client ID
#batata.core.auth.oauth.client_id:

# OIDC client secret
#batata.core.auth.oauth.client_secret:

# OIDC scopes
#batata.core.auth.oauth.scope: openid

# Token validation method: jwt or introspection (not yet implemented)
#batata.core.auth.oauth.token_validation_method:

# JWKS cache TTL in seconds (not yet implemented)
#batata.core.auth.oauth.jwks_cache_ttl_secs:

# Username claim in ID token
#batata.core.auth.oauth.username_claim: sub

# Roles claim in ID token
#batata.core.auth.oauth.roles_claim:

# Admin role name in OIDC claims
#batata.core.auth.oauth.admin_role:

# Auto create user on first login
#batata.core.auth.oauth.auto_create_user: true

# External authorization endpoint (IdP handles all authorization)
#batata.core.auth.oauth.authorization_endpoint:

# Authorization request timeout in milliseconds
#batata.core.auth.oauth.authorization_timeout_ms:

# Whether to enforce strict nonce validation (not yet implemented)
#batata.core.auth.oauth.strict_nonce_validation: false

# Whether to enforce strict audience validation (not yet implemented)
#batata.core.auth.oauth.strict_audience_validation: false

# OAuth cache settings
#batata.core.auth.oauth.cache.discovery_ttl_secs: 3600
#batata.core.auth.oauth.cache.discovery_capacity: 100
#batata.core.auth.oauth.cache.state_ttl_secs: 600
#batata.core.auth.oauth.cache.state_capacity: 10000
#batata.core.auth.oauth.http_timeout_secs: 30

# --- Security Ignore URLs ---
# The ignore urls of auth (not yet implemented)
#batata.security.ignore.urls: /,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**

# --- Snowflake Worker ID ---
# Set the WorkerID manually (not yet implemented)
#batata.core.snowflake.worker_id:

# =============================================================================
# Rate Limiting
# =============================================================================

# API rate limiting
batata.ratelimit.enabled: false
batata.ratelimit.max_requests: 10000
batata.ratelimit.window_seconds: 60

# Authentication rate limiting (brute force protection)
batata.ratelimit.auth.enabled: false
batata.ratelimit.auth.max_attempts: 5
batata.ratelimit.auth.window_seconds: 60
batata.ratelimit.auth.lockout_seconds: 300

# =============================================================================
# Control Plugin (TPS Rate Limiting & Connection Control)
# =============================================================================

# Enable TPS rate limiting and connection control
batata.plugin.control.enabled: false
# Default TPS limit per control point when no specific rule matches
batata.plugin.control.default_tps: 10000
# Maximum concurrent gRPC connections
batata.plugin.control.max_connections: 50000

# Control plugin manager type
#batata.plugin.control.manager.type: nacos

# Local control rule storage dir
#batata.plugin.control.rule.local.basedir: ${batata.home}

# External control rule storage type, if exist
#batata.plugin.control.rule.external.storage:

