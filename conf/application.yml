# =============================================================================

# Whether AI module is enabled, default true.
# The AI module needs both config module and naming module enabled.
# If false, the console hides AI registry entries and AI console APIs are disabled.
#batata.extension.ai.enabled: true

# --- AI Registry ---
# Unified AI registry port (default 9080).
# batata.ai.mcp.registry.port is deprecated, use batata.ai.registry.port instead.
#batata.ai.registry.port: 9080

# Whether MCP registry is enabled, default is false.
# When enabled=true, starts an MCP registry server on batata.ai.registry.port
batata.ai.mcp.registry.enabled: false
batata.ai.mcp.registry.port: 9080

# Whether skill registry is enabled, default is false.
# When enabled=true, starts a skill registry server on batata.ai.registry.port
#batata.ai.skill.registry.enabled: false

# --- AI Publish Pipeline ---
# Total switch for ai-pipeline plugin
#batata.plugin.ai-pipeline.enabled: true
# Pipeline type: skill-scanner (skill-scanner execution not yet implemented)
#batata.plugin.ai-pipeline.type: skill-scanner
#batata.plugin.ai-pipeline.skill-scanner.enabled: true
# Optional: specify an absolute executable path when PATH resolution differs
#batata.plugin.ai-pipeline.skill-scanner.command: /Users/your-user/.local/bin/skill-scanner
# Optional: auto-publish skill versions after pipeline approval, default false
#batata.ai.skill.auto_publish_after_review.enabled: false

# --- AI Resource Importer (not yet implemented) ---
# Optional: reopen deprecated legacy MCP import APIs during a compatibility window
#batata.ai.resource.import.legacy_mcp_api_enabled: false
# Optional: allow legacy MCP import APIs to fetch user-provided URLs when reopened
#batata.ai.resource.import.allow_user_url: false
# Enable the built-in official MCP registry import source. Source id: mcp-official
#batata.plugin.ai.importer.mcp.official.enabled: true
# Enable the built-in Skill well-known import source. Configure the registry root URL first.
#batata.plugin.ai.importer.skills.well-known.enabled: true
#batata.plugin.ai.importer.skills.well-known.url: https://developers.cloudflare.com
# Enable the built-in skills.sh import source. Source id: skills-sh.
#batata.plugin.ai.importer.skills.skills-sh.enabled: true
# Optional: allow non-HTTPS or private-network endpoints only for controlled deployments.
#batata.plugin.ai.importer.<preset>.allow_http: false
#batata.plugin.ai.importer.<preset>.allow_private_network: false

# =============================================================================
# Service Mesh (xDS)
# =============================================================================

batata.mesh.xds.enabled: false
batata.mesh.xds.port: 15010
batata.mesh.xds.server.id: batata-xds-server
batata.mesh.xds.sync.interval.ms: 5000
batata.mesh.xds.generate.listeners: true
batata.mesh.xds.generate.routes: true
batata.mesh.xds.default.listener.port: 15001
#batata.mesh.xds.tls.enabled: false
#batata.mesh.xds.tls.cert.path: /path/to/xds-server.crt
#batata.mesh.xds.tls.key.path: /path/to/xds-server.key

# =============================================================================
# Istio MCP Server
# =============================================================================

# If turn on the Istio MCP server
#batata.istio.mcp.server.enabled: false

# =============================================================================
# Kubernetes Sync
# =============================================================================

# If turn on the K8s sync
#batata.k8s.sync.enabled: false

# If use the API from an application outside a kubernetes cluster
#batata.k8s.sync.outside_cluster: false
#batata.k8s.sync.kube_config: /.kube/config

